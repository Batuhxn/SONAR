[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-a0"
version = "0.1.0"
description = "Local, evidence-backed Turkish supplier integration feasibility probe"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.scripts]
sonar-a0 = "sonar_a0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
