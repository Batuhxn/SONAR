[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-a0"
version = "0.2.0"
description = "Self-hosted electronics procurement workspace with A0 supplier adapters"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1"]

[project.scripts]
sonar-a0 = "sonar_a0.cli:main"
sonar = "sonar_web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonar_web = ["static/*"]
