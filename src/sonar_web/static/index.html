<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SONAR · Session BoMs</title>
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to workspace</a>
    <header class="app-header">
      <a href="#dashboard" class="brand" aria-label="SONAR home"
        ><img src="/static/logo.svg" width="28" height="28" alt="" />SONAR</a
      >
      <nav aria-label="Primary navigation">
        <a href="#dashboard" data-page="dashboard"
          ><span class="nav-icon" aria-hidden="true">▦</span
          ><span>Session BoMs</span
          ><span id="bom-count" class="nav-count">0</span></a
        >
        <a href="#workspace" data-page="workspace"
          ><span class="nav-icon" aria-hidden="true">1</span><span>BoM</span></a
        >
        <a href="#suppliers" data-page="suppliers"
          ><span class="nav-icon" aria-hidden="true">2</span
          ><span>Suppliers</span></a
        >
        <a href="#procurement" data-page="procurement"
          ><span class="nav-icon" aria-hidden="true">3</span
          ><span>Purchase list</span></a
        >
      </nav>
      <span class="session-pill">Temporary session</span>
      <button
        id="theme"
        class="theme-button"
        aria-label="Switch to dark theme"
        title="Switch to dark theme"
      >
        ◐
      </button>
    </header>
    <div class="shell">
      <main id="main" tabindex="-1">
        <div class="loading" role="status">Connecting to your workspace…</div>
      </main>
      <footer>
        <span>SONAR A1.1 · <span id="breadcrumb">Session BoMs</span></span
        ><span
          >Export before your session expires. No automatic purchasing.</span
        >
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dialog"><div id="dialog-body"></div></dialog>
  </body>
</html>
